name: app
description: Jevlis Ka - Recipe application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_widget_from_html: ^0.17.4
  hive_flutter: ^1.1.0
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Satoshi
      fonts:
        - asset: fonts/Satoshi-Medium.ttf
    - family: Telma
      fonts:
        - asset: fonts/Telma-Medium.ttf
  assets:
      - images/